# Render blueprint - creates the web service and Postgres together.
services:
  - type: web
    name: hw-attendance
    runtime: node
    plan: starter          # Pro-tier account; bump if you need more memory
    buildCommand: npm ci
    startCommand: npm run migrate && npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true      # Render generates a strong secret
      - key: DATABASE_URL
        fromDatabase:
          name: hw-attendance-db
          property: connectionString

databases:
  - name: hw-attendance-db
    plan: basic-256mb
    postgresMajorVersion: "16"
