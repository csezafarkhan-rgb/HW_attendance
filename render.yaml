# Render blueprint - free tier for testing.
# To move to paid later: change `plan: free` to `plan: starter` (service)
# and `plan: basic-256mb` (database), then redeploy.
services:
  - type: web
    name: hw-attendance
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run migrate && npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true      # Render generates a strong secret
      - key: DATABASE_URL
        fromDatabase:
          name: hw-attendance-db
          property: connectionString
      # Free-tier services have no Shell, so the first admin cannot be created
      # by hand. Set these two in the Render dashboard and the migration will
      # create that account on first boot. Safe to leave set: it only ever
      # acts when the users table is empty.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: hw-attendance-db
    plan: free
    postgresMajorVersion: "16"
